<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="gatekeyp — a privacy-preserving, federated event-organizing toolkit. Organize gatherings and share keyed invitations without adtech or tracking.">
    <meta name="color-scheme" content="dark">
    <title>gatekeyp</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23111111' d='M7.5 11a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Zm0 2.4a2.1 2.1 0 1 0 0 4.2 2.1 2.1 0 0 0 0-4.2Z'/%3E%3Cpath fill='none' stroke='%23111111' stroke-linecap='round' stroke-width='2' d='M11 11 20 2M16 6l3 3M13 9l2.5-2.5'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>

    <div class="app">
        <header class="topbar">
            <a class="brand" href="#/" aria-label="gatekeyp — home">
                <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="7.5" cy="15.5" r="4.5"></circle>
                    <path d="M11 11 20 2m-4 4 3 3m-6 0 2.5-2.5"></path>
                </svg>
                <span class="brand-name">gatekeyp</span>
            </a>
            <nav class="topnav" aria-label="Primary">
                <a class="nav-link" href="#/organize">Organize</a>
                <a class="nav-link" href="#/join">Join</a>
                <a class="nav-link" href="#/flyer">Flyer</a>
            </nav>
        </header>

        <main id="main" class="stage">
            <div class="stage-inner">

                <!-- ================= Landing ================= -->
                <section id="view-home" class="view">
                    <div class="view-head">
                        <p class="eyebrow">gatekeyp</p>
                        <div class="home-actions">
                            <a class="btn btn-primary" href="#/organize">Make an event</a>
                            <a class="btn btn-ghost" href="#/join">Unlock an invite</a>
                        </div>
                        <div id="home-session" class="home-session" hidden></div>
                    </div>
                </section>


                <!-- ================= Organize ================= -->
                <section id="view-organize" class="view" hidden>
                    <!-- entry: create / open -->
                    <div id="organize-entry">
                        <header class="view-head">
                            <p class="eyebrow">Organizer desk</p>
                            <h2 class="view-title">Make an event</h2>
                        </header>

                        <div class="split-cards">
                            <form id="create-event-form" class="card form-card" autocomplete="off">
                                <h3 class="card-title">New gathering</h3>
                                <div class="field">
                                    <label for="title">Title <span class="req">*</span></label>
                                    <input type="text" id="title" name="title" required maxlength="256"
                                           autocomplete="off">
                                </div>
                                <div class="field">
                                    <label for="description">Description <span class="req">*</span></label>
                                    <textarea id="description" name="description" required maxlength="65536"
                                              rows="4"></textarea>
                                </div>
                                <div class="field">
                                    <label for="location-data">Where it happens <span class="opt">optional</span></label>
                                    <input type="text" id="location-data" name="location_data" maxlength="1024"
                                           autocomplete="off">
                                </div>
                                <p id="create-note" class="form-note" role="status" aria-live="polite"></p>
                                <button type="submit" class="btn btn-primary btn-block" id="create-btn">
                                    Create event
                                </button>
                            </form>

                            <form id="open-event-form" class="card form-card" autocomplete="off">
                                <h3 class="card-title">Open an existing event</h3>
                                <div class="field">
                                    <label for="open-event-id">Event ID</label>
                                    <input type="text" id="open-event-id" name="event_id" required
                                           spellcheck="false" autocomplete="off">
                                </div>
                                <div class="field">
                                    <label for="open-master-key">Master key</label>
                                    <input type="password" id="open-master-key" name="master_key" required
                                           spellcheck="false" autocomplete="off">
                                </div>
                                <p id="open-note" class="form-note" role="status" aria-live="polite"></p>
                                <button type="submit" class="btn btn-secondary btn-block" id="open-btn">
                                    Open workspace
                                </button>
                            </form>
                        </div>
                    </div>

                    <!-- workspace: rendered by app.js -->
                    <div id="organize-workspace" hidden>
                        <div id="organize-views"></div>
                    </div>
                </section>

                <!-- ================= Join ================= -->
                <section id="view-join" class="view" hidden>
                    <!-- entry: unlock -->
                    <div id="join-entry">
                        <div id="key-drop" class="key-drop" tabindex="0" role="button"
                             aria-label="Drop, paste or choose an invite image">
                            <div class="key-drop-inner">
                                <span class="key-drop-icon" aria-hidden="true">⤓</span>
                                <div class="key-drop-title">Drop your invite here</div>
                                <div class="key-drop-sub">or paste it with ⌘V</div>
                            </div>
                            <input type="file" id="key-drop-file" accept="image/png,image/*" hidden>
                        </div>

                        <p id="join-note" class="form-note" role="status" aria-live="polite"></p>
                    </div>

                    <!-- event page: rendered by app.js -->
                    <div id="join-event" hidden>
                        <div id="join-views"></div>
                    </div>
                </section>

                <!-- ================= Flyer (lite funnel) ================= -->
                <section id="view-flyer" class="view" hidden>
                    <div id="flyer-entry">
                        <form id="flyer-form" class="card form-card" autocomplete="off">
                            <div class="field">
                                <label for="flyer-title">Event title <span class="req">*</span></label>
                                <input type="text" id="flyer-title" name="title" required maxlength="256"
                                       autocomplete="off">
                            </div>
                            <div class="field">
                                <label for="flyer-description">Description</label>
                                <textarea id="flyer-description" rows="3" maxlength="65536"></textarea>
                            </div>
                            <div class="field">
                                <label for="flyer-when">When <span class="req">*</span></label>
                                <input type="datetime-local" id="flyer-when" required autocomplete="off">
                            </div>
                            <div class="field">
                                <label for="flyer-where">Where</label>
                                <input type="text" id="flyer-where" maxlength="256"
                                       autocomplete="off">
                            </div>
                            <div class="field">
                                <label for="flyer-file">Flyer image <span class="opt">optional</span></label>
                                <input type="file" id="flyer-file" accept="image/png,image/jpeg,image/webp">
                            </div>
                            <div class="field">
                                <label for="flyer-ttl">Gone after (hours after the event)</label>
                                <input type="number" id="flyer-ttl" min="1" max="336" value="48">
                            </div>
                            <p id="flyer-note" class="form-note" role="status" aria-live="polite"></p>
                            <button type="submit" class="btn btn-primary btn-block" id="flyer-btn">
                                Create flyer event
                            </button>
                        </form>
                    </div>
                    <div id="flyer-done" hidden></div>
                </section>

                <!-- ================= Lite event page (attendee) ================= -->
                <section id="view-e" class="view" hidden>
                    <div id="lite-views"></div>
                </section>

            </div>
        </main>

    </div>

    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="false"></div>
    <div id="modal-root"></div>

    <script src="vendor/qrcode-generator.js"></script>
    <script src="vendor/jsqr.js"></script>
    <script src="stego.js"></script>
    <script src="door_qr.js"></script>
    <script src="invite_card.js"></script>
    <script src="app.js"></script>
</body>
</html>

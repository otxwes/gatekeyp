[pytest]
pythonpath = . tests
testpaths = tests
addopts = -m 'not e2e' --strict-markers -ra
timeout = 300
markers =
    e2e: browser end-to-end tests (run explicitly: uv run pytest tests/e2e -m e2e)
filterwarnings =
    # Third-party deprecation from fastapi/starlette about httpx2 (not ours;
    # not yet actioned). Suppressed so it doesn't mask real warnings.
    ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning

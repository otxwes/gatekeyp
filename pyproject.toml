[project]
name = "gatekeyp"
version = "0.1.0"
description = "A privacy-preserving, federated event-organizing toolkit with a secure Key system"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0.0",
    "argon2-cffi>=23.1.0",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
mesh = [
    "lxmf>=1.1.1",
    "rns>=1.5.4",
]

[dependency-groups]
dev = [
    {include-group = "lint"},
    {include-group = "test"},
    {include-group = "audit"},
]
lint = [
    "ruff",
    "ty",
    "pre-commit",
]
test = [
    "pytest>=8.0.0",
    "hypothesis>=6.0.0",
    "httpx>=0.28.1",
    "playwright>=1.63.0",
    "pytest-playwright>=0.9.0",
]
audit = [
    "pip-audit",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "COM812", "ISC001", "PLR0911", "PLR0913", "PLR0917"]

[tool.ruff.lint.per-file-ignores]
# Test files use unittest-style assertions and fixtures
"tests/**" = [
    "ANN001",  # Missing type annotation for function argument
    "ANN201",  # Missing return type annotation for public function
    "ANN202",  # Missing return type annotation for private function
    "CPY001",  # Missing copyright notice
    "ERA001",  # Commented-out code (section headers in tests)
    "PLC0415", # Import should be at top-level
    "PT009",   # Use regular assert instead of unittest-style
    "PT011",   # Use regular assert instead of unittest-style
    "PT012",   # Use regular assert instead of unittest-style
    "PT013",   # Use regular assert instead of unittest-style
    "PT015",   # Use regular assert instead of unittest-style
    "PT018",   # Use regular assert instead of unittest-style
    "PT023",   # Use regular assert instead of unittest-style
    "PT024",   # Use regular assert instead of unittest-style
    "PT025",   # Use regular assert instead of unittest-style
    "PT026",   # Use regular assert instead of unittest-style
    "PT027",   # Use regular assert instead of unittest-style
    "PLR2004", # Magic value used in comparison (test assertions)
    "PTH100",  # os.path.abspath should be replaced by Path.resolve
    "PTH120",  # os.path.dirname should be replaced by Path.parent
    "S101",    # Use of assert (pytest-style assertions)
    "S105",    # Possible hardcoded password (test fixtures)
    "S106",    # Possible hardcoded password (test fixtures)
    "S107",    # Possible hardcoded password (test fixtures)
    "S108",    # Possible hardcoded temporary file
    "SLF001",  # Private member access (test fixtures)
    "TID252",  # Relative imports
]

# Mesh (LXMF) prototype: optional deps are imported lazily on purpose and
# RNS/LXMF objects are duck-typed (not in the base dependency set)
"src/ephemeral/lxmf_delivery.py" = ["PLC0415", "ANN401"]

# Browser end-to-end suite: spawns the server via uv (shell-out), probes it
# with urllib over loopback, and its fixtures need the server purely for
# fixture-ordering (ARG001); long failure messages are the point (TRY003).
"tests/e2e/**" = [
    "INP001",  # pytest rootdir-based collection without package marker
    "S607",    # `uv` resolves via PATH; tests run in a controlled repo checkout
    "S310",    # only talking to our own 127.0.0.1 server on loopback
    "S603",    # subprocess with list args (Playwright server spawn)
    "TRY003",  # long inline messages explain exactly what failed to boot
    "EM102",   # f-string error text in the boot-failure path
    "ARG001",  # unused `server` only forces fixture ordering
    "D105",
]

# Demo script: prints are the point; it is not a package, and its
# sys.path insert must precede the repo import (E402)
"scripts/**" = ["E402", "INP001", "PLC0415", "T201"]

[tool.ty.environment]
python-version = "3.11"

[tool.uv]
package = false
